<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Allowance mark: a rising arrow stopped by the cap bar. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e71ff"/>
      <stop offset="1" stop-color="#4d50d8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <!-- the cap -->
  <rect x="16" y="14" width="32" height="6" rx="3" fill="#ffffff"/>
  <!-- the arrow, stopped just beneath it -->
  <path d="M32 24 L44 38 L37 38 L37 47 A5 5 0 0 1 27 47 L27 38 L20 38 Z" fill="#ffffff"/>
</svg>
