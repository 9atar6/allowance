name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck + test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [dashboard, proxy]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test (with coverage floor)
        run: npm run test:ci

  build:
    name: dashboard production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      # Placeholders so module-load env guards don't fail the CI build.
      # Real values live only in Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: e2e (public + staging journey)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      # Public by design (these ship in the browser bundle).
      NEXT_PUBLIC_SUPABASE_URL: https://izcxmonodmfoebaazxxe.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6Y3htb25vZG1mb2ViYWF6eHhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4ODY1ODQsImV4cCI6MjA5NjQ2MjU4NH0.g3g2_lNs0KZOxZ28dQ-uHIVH4y9ZzIdetTbF-JP3arQ
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      # Staging credentials (repo secrets). When present, the authed journey
      # runs against the staging Supabase + staging worker; when absent
      # (e.g. fork PRs), dashboard.spec.ts self-skips and only the public
      # tier runs.
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 7
